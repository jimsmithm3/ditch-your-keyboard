[project]
name = "ditch-your-keyboard"
version = "0.1.0"
description = "Hands-free voice input that drives GSPro key bindings."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PySide6_Essentials==6.12.0",
    "sounddevice==0.5.6",
    "PyDirectInput==1.0.4",
    "pygetwindow==0.0.9",
]

[tool.setuptools]
py-modules = ["main"]
